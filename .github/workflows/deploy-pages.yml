name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: cd039325e52c5ed9458839daf8be0ade
  PAGES_PROJECT: gba-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gba.sox.lol
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Syntax check
        run: |
          for file in js/*.js; do
            node --check "$file"
          done

      - name: Build static bundle
        run: |
          rm -rf dist
          mkdir dist
          cp index.html styles.css coi-serviceworker.js _headers LICENSE NOTICE README.md dist/
          cp -r js vendor demo licenses dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx -y wrangler@4.151.1 pages deploy dist \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true

      - name: Write summary
        run: |
          echo "### Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://gba.sox.lol" >> "$GITHUB_STEP_SUMMARY"
